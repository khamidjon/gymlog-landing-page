<style>
:root{
  --bg:#000; --txt:#fff; --mut:#A1A1A9; --dim:#5A5A62;
  --line:rgba(255,255,255,.14); --line-soft:rgba(255,255,255,.09);
  --card:#0C0C0E;
  --font:-apple-system,"SF Pro Display",BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%;overflow-x:clip}
body{
  background:var(--bg); color:var(--txt); font-family:var(--font);
  -webkit-font-smoothing:antialiased; text-wrap:pretty; overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
[hidden]{display:none !important}
.wrap{width:100%; max-width:1120px; margin:0 auto; padding:0 20px}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.r1,.r2,.r3,.r4,.r5{animation:rise .55s cubic-bezier(.22,.8,.3,1) both}
.r2{animation-delay:.06s}.r3{animation-delay:.12s}.r4{animation-delay:.18s}.r5{animation-delay:.26s}
@media (prefers-reduced-motion:reduce){
  .r1,.r2,.r3,.r4,.r5{animation:none}
  .iab-arrow{animation:none !important}
}

/* ── header ─────────────────────────────────────────────────────── */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-top:22px}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand .icon{width:46px; height:46px; flex:none; border-radius:23%; overflow:hidden;
  background:var(--card); box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.brand .icon img{width:100%;height:100%;object-fit:cover}
.brand .word{font:800 25px/1 var(--font); letter-spacing:-.035em; white-space:nowrap}
.brand .word i{font-style:normal; color:var(--mut)}
.top-right{display:flex; align-items:center; gap:14px}
.socials{display:flex; align-items:center; gap:6px}
.socials a{display:grid; place-items:center; width:34px; height:34px; border-radius:10px;
  color:#fff; opacity:.85; transition:opacity .15s ease, background .15s ease}
.socials a:hover{opacity:1; background:rgba(255,255,255,.08)}
.socials svg{width:19px;height:19px}
.langs{display:flex; gap:2px; padding:3px; border:1px solid var(--line-soft);
  border-radius:99px; background:rgba(255,255,255,.03)}
.langs button{all:unset; cursor:pointer; padding:4px 9px; border-radius:99px;
  font:700 11px/1 var(--font); letter-spacing:.04em; color:var(--dim)}
.langs button.on{color:#000; background:#fff}
.langs button:not(.on):hover{color:#fff}
/* narrow screens: the header keeps brand + language only; socials stay in the footer */
@media (max-width:560px){ .top .socials{display:none} }

/* ── hero ───────────────────────────────────────────────────────── */
.hero{text-align:center; margin-top:clamp(30px,7vh,78px)}
h1{font:800 clamp(31px,7.4vw,58px)/1.12 var(--font); letter-spacing:-.035em;
  max-width:16ch; margin:0 auto}
h1 mark{background:#fff; color:#000; border-radius:.16em;
  padding:.02em .16em .08em; margin:0 -.02em;
  -webkit-box-decoration-break:clone; box-decoration-break:clone}
.sub{margin:clamp(14px,2.4vh,26px) auto 0; max-width:52ch; color:var(--mut);
  font:400 clamp(13.5px,1.6vw,18px)/1.5 var(--font)}

/* ── store badges ───────────────────────────────────────────────── */
.badges{display:flex; justify-content:center; flex-wrap:wrap;
  gap:clamp(10px,1.4vw,16px); margin-top:clamp(18px,3vh,32px)}
.badge{display:flex; align-items:center; gap:10px;
  height:clamp(50px,6.4vh,62px); padding:0 clamp(14px,1.6vw,20px);
  background:#000; border:1px solid var(--line); border-radius:9px;
  transition:border-color .15s ease, background .15s ease, transform .12s ease;
  -webkit-tap-highlight-color:transparent}
.badge:hover{border-color:rgba(255,255,255,.4); background:#0A0A0A}
.badge:active{transform:scale(.98)}
.badge svg{width:clamp(21px,2.4vw,26px);height:auto;flex:none}
.badge .lbl{display:flex; flex-direction:column; line-height:1; text-align:left}
.badge .lbl small{font:500 clamp(8.5px,.95vw,10.5px)/1 var(--font);
  letter-spacing:.02em; text-transform:uppercase; color:#fff; opacity:.92}
.badge .lbl b{font:600 clamp(16px,1.9vw,21px)/1.15 var(--font); letter-spacing:-.02em; margin-top:3px}

/* ── Instagram in-app-browser helper ────────────────────────────── */
.iab{display:grid; grid-template-columns:24px 1fr; gap:11px; align-items:center;
  width:100%; max-width:430px; margin:14px auto 0; text-align:left;
  padding:10px 14px; border:1px solid var(--line); border-radius:14px;
  background:rgba(255,255,255,.04);
  transition:border-color .35s ease, background .35s ease}
.iab.armed{border-color:rgba(255,255,255,.42); background:rgba(255,255,255,.09)}
.iab-arrow{width:24px;height:24px;color:rgba(255,255,255,.55);animation:nudge 2.8s ease-in-out infinite}
.iab.armed .iab-arrow{color:#fff}
@keyframes nudge{0%,100%{transform:translate(0,0)}45%{transform:translate(2px,-3px)}}
.iab-title{font:700 13px/1.3 var(--font); display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.iab-body{margin-top:2px; font:400 11.5px/1.35 var(--font); color:var(--mut)}
.dots{display:inline-block; padding:0 6px; border-radius:6px;
  border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.1);
  font:800 11px/16px var(--font); letter-spacing:1px}

/* ── hero phone row ─────────────────────────────────────────────── */
.shots{position:relative; margin-top:clamp(26px,5vh,58px);
  display:flex; justify-content:center; align-items:flex-start; gap:clamp(16px,2.2vw,34px)}
.shots img{width:clamp(126px,13.6vw,160px); height:auto; flex:none;
  border-radius:clamp(13px,1.5vw,18px);
  box-shadow:0 0 0 1px rgba(255,255,255,.13), 0 18px 40px -10px rgba(0,0,0,.9)}
/* On phones the row deliberately bleeds past both edges so the middle screen
   stays big and legible; side fades keep the cut soft. */
@media (max-width:760px){
  .shots{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);
  }
}

/* ── ratings + reviews ──────────────────────────────────────────── */
.gold{color:#FFC83D}
.ratings{margin-top:clamp(48px,9vh,90px); display:flex; justify-content:center;
  align-items:center; gap:14px}
.ratings .r-badge{width:40px;height:40px;flex:none;color:#fff;opacity:.95}
.ratings .r-col{text-align:left}
.ratings .r-score{font:800 21px/1 var(--font)}
.ratings .r-score span{color:var(--mut); font-weight:600}
.rstars{display:flex; gap:2px; margin-top:5px}
.rstars svg{width:15px;height:15px;fill:#FFC83D}
.ratings .r-cap{margin-top:5px; font:500 12px/1 var(--font); color:var(--mut)}
.ratings a.r-cap{text-decoration:underline; text-underline-offset:3px}
.ratings a.r-cap:hover{color:#fff}

.reviews{margin-top:clamp(26px,4.5vh,44px); display:grid;
  grid-template-columns:1fr 1fr; gap:clamp(14px,1.8vw,24px)}
.review{border:1px solid var(--line); border-radius:14px; background:var(--card);
  padding:clamp(18px,2.4vw,26px); display:flex; flex-direction:column; gap:12px}
.review .head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.review .head b{font:800 clamp(16px,1.8vw,19px)/1.2 var(--font);
  text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:2px}
.review .stars5{display:flex; gap:2px; flex:none}
.review .stars5 svg{width:15px;height:15px;fill:#FFC83D}
.review p{color:#E8E8EC; font:400 clamp(13.5px,1.45vw,15.5px)/1.55 var(--font); flex:1}
.review .who{align-self:flex-end; font:500 12.5px/1 var(--font); color:var(--mut)}
@media (max-width:760px){ .reviews{grid-template-columns:1fr} }

/* ── feature grid ───────────────────────────────────────────────── */
.fgrid{margin-top:clamp(64px,12vh,130px); display:grid;
  grid-template-columns:repeat(4,1fr); gap:clamp(12px,1.6vw,20px)}
.fcard{border:1px solid var(--line-soft); border-radius:16px; background:var(--card);
  padding:clamp(16px,2vw,22px)}
.fcard svg{width:24px;height:24px;color:#fff;opacity:.95}
.fcard b{display:block; margin-top:12px; font:800 clamp(14.5px,1.5vw,16.5px)/1.25 var(--font);
  letter-spacing:-.01em}
.fcard p{margin-top:6px; color:var(--mut); font:400 clamp(12.5px,1.3vw,13.5px)/1.5 var(--font)}
@media (max-width:940px){ .fgrid{grid-template-columns:1fr 1fr} }
@media (max-width:480px){ .fgrid{grid-template-columns:1fr} }

/* bottom CTA */
.cta2{margin-top:clamp(64px,12vh,130px); text-align:center}
.cta2 h2{font:800 clamp(28px,4.4vw,46px)/1.12 var(--font); letter-spacing:-.035em}
.cta2 p{margin:12px auto 0; color:var(--mut); font:400 clamp(14px,1.5vw,17px)/1.5 var(--font)}

/* footer */
.foot{margin-top:clamp(64px,12vh,120px); border-top:1px solid var(--line-soft);
  padding:26px 0 calc(28px + env(safe-area-inset-bottom))}
.foot .row{display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap}
.foot .left{display:flex; align-items:center; gap:10px}
.foot .left .icon{width:30px;height:30px;border-radius:24%;overflow:hidden}
.foot .left .icon img{width:100%;height:100%;object-fit:cover}
.foot .left b{font:800 15px/1 var(--font)}
.foot .links{display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  font:500 12.5px/1 var(--font); color:var(--mut)}
.foot .links a:hover{color:#fff}
.foot .copy{margin-top:16px; font:400 11.5px/1.5 var(--font); color:var(--dim)}

/* ── short viewports (Instagram's in-app browser is ~560pt tall) ────
   Tighten everything above the badges so the store buttons and the
   escape-hatch helper are on screen without scrolling. */
@media (max-height:680px){
  .top{padding-top:14px}
  .brand .icon{width:40px;height:40px}
  .brand .word{font-size:22px}
  .hero{margin-top:18px}
  h1{font-size:clamp(26px,7vw,34px)}
  .sub{margin-top:11px; font-size:13px; max-width:40ch}
  .badges{margin-top:15px}
  .shots{margin-top:20px}
}
@media (max-height:600px){ .sub{display:none} }
@media (max-height:500px){ .iab-body{display:none} }

/* ?frame=1 — dev aid: clamp to the 375×560 Instagram viewport */
body.framed{padding:20px;display:flex;justify-content:center;align-items:flex-start;background:#101014}
body.framed .site{width:375px;height:560px;overflow-y:auto;outline:1px dashed #2C2C2E;background:#000}

document.getElementById('shots').innerHTML = C.screens.map(function(src, i){
  return '<img src="' + src + '" width="420" height="891" alt="" decoding="async"' +
         (i === mid ? ' fetchpriority="high"' : '') + '>';
}).join('');

/* ══ store badges + smart tap ═══════════════════════════════════════
   The visitor's own store is listed first. Each badge tries the app scheme
   (or an Android intent:// URL — the one handoff Meta's in-app browser
   honours) and falls back to the plain https store link if nothing took over. */
var APPLE_SVG = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M17.05 12.54c-.03-2.5 2.04-3.7 2.13-3.76-1.16-1.7-2.97-1.93-3.61-1.96-1.54-.16-3 .9-3.78.9-.78 0-1.98-.88-3.26-.86-1.68.03-3.22.98-4.08 2.48-1.74 3.02-.44 7.5 1.25 9.95.83 1.2 1.82 2.55 3.12 2.5 1.25-.05 1.72-.8 3.23-.8 1.5 0 1.93.8 3.25.78 1.35-.02 2.2-1.22 3.02-2.43.95-1.39 1.34-2.74 1.36-2.81-.03-.01-2.61-1-2.63-3.99zM14.55 5.2c.69-.84 1.15-2 1.02-3.16-.99.04-2.2.66-2.9 1.5-.64.74-1.2 1.93-1.05 3.07 1.1.09 2.24-.57 2.93-1.41z"/></svg>';
var PLAY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + '<path fill="#00A0FF" d="M3.4 2.1c-.2.2-.3.5-.3.9v18c0 .4.1.7.3.9L12.5 12z"/>'
  + '<path fill="#00C853" d="M3.4 2.1 15.6 8.9 12.5 12z"/>'
  + '<path fill="#FF3A44" d="M3.4 21.9 15.6 15.1 12.5 12z"/>'
  + '<path fill="#FFBC00" d="M15.6 8.9 19.9 11.3c.8.4.8 1 0 1.4l-4.3 2.4L12.5 12z"/></svg>';

var pkg = (C.android.url.match(/id=([\w.]+)/) || [])[1] || '';
function intentUrl(){
  return 'intent://details?id=' + pkg +
    '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' +
    encodeURIComponent(C.android.url) + ';end';
}
function badgeHTML(platform){
  var apple = platform === 'ios';
  return '<a class="badge" data-p="' + platform + '" rel="noopener" href="' + C[platform].url + '">' +
    (apple ? APPLE_SVG : PLAY_SVG) +
    '<span class="lbl"><small>' + (apple ? T.badgeApple : T.badgeGoogle) + '</small>' +
    '<b>' + (apple ? T.storeIos : T.storeAndroid) + '</b></span></a>';
}
var order = os === 'android' ? ['android','ios'] : ['ios','android'];
['badges-hero','badges-bottom'].forEach(function(id){
  document.getElementById(id).innerHTML = order.map(badgeHTML).join('');
});
[].forEach.call(document.querySelectorAll('.badge'), function(el){
  el.addEventListener('click', function(e){
    var platform = el.getAttribute('data-p'), cfg = C[platform];
    if (inIAB){
      var box = document.getElementById('iab');
      box.classList.add('armed');
      box.querySelector('.iab-body').textContent = T.iabBodyArmed;
    }
    if (!C.preferScheme) return;
    var deep = platform === 'android' ? (inIAB ? intentUrl() : cfg.schemeUrl) : cfg.schemeUrl;
    if (!deep) return;
    e.preventDefault();
    var gone = false;
    function mark(){ gone = true; }
    document.addEventListener('visibilitychange', function(){ if (document.hidden) mark(); }, {once:true});
    window.addEventListener('pagehide', mark, {once:true});
    setTimeout(function(){ if (!gone) location.href = cfg.url; }, 1600);
    location.href = deep;
  });
});

if (inIAB) document.getElementById('iab').hidden = false;

/* footer links + copy */
var fl = [];
if (C.links.privacy) fl.push('<a href="' + C.links.privacy + '">' + T.privacy + '</a>');
if (C.links.terms)   fl.push('<a href="' + C.links.terms + '">' + T.terms + '</a>');
if (C.social.email)  fl.push('<a href="mailto:' + C.social.email + '">' + C.social.email + '</a>');
document.getElementById('foot-links').innerHTML = fl.join('');
document.getElementById('copy').textContent = T.copy;

/* Preview hook: __preview('iab'|'web', 'ru', 'android') */
window.__preview = function(s, l, o){
  location.replace(location.pathname + '?state=' + (s || (inIAB ? 'iab' : 'web')) +
                   '&lang=' + (l || lang) + '&os=' + (o || os));
};
</script>
</body>
</html>
